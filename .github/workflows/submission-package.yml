name: AI Players exercise packaging
on:
  push:
    paths:
      - .github/workflows/submission-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deliverables:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
      AVALAI_MODEL: gpt-4o-mini
      AVALAI_BASE_URL: https://api.avalai.org/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Archive WAT project code without secrets
        run: |
          zip -q -r course-advisor-ai-source.zip Workflow Agent Tools app docs scripts tests README.md AGENT.md requirements.txt .env.example .gitignore
      - name: Upload standalone source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: course-advisor-ai-wat-source
          path: course-advisor-ai-source.zip
          retention-days: 7
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Generate UX report with real APIs (single bounded run)
        run: python -m scripts.single_topic_smoke --confirm-live --max-pages 10 --input tests/sample_input_ux.json --output-dir outputs/ux
      - name: Upload real UX report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-advisor-ux-real
          path: outputs/ux/
          if-no-files-found: warn
          retention-days: 7
