name: Live API connectivity (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
      AVALAI_MODEL: gpt-4o-mini
      AVALAI_BASE_URL: https://api.avalai.ir/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check both live APIs with limited requests
        run: python -m scripts.connectivity_check --confirm-live
