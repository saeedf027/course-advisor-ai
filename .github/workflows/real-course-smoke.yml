name: Course Advisor real end-to-end smoke (manual)

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Total source-page cap across adaptive rounds; higher means more API credits"
        required: true
        default: "10"
        type: choice
        options:
          - "6"
          - "8"
          - "9"
          - "10"
          - "12"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
      AVALAI_MODEL: gpt-4o-mini
      AVALAI_BASE_URL: https://api.avalai.org/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run bounded live data-analysis test
        run: python -m scripts.single_topic_smoke --confirm-live --max-pages ${{ inputs.max_pages }}
      - name: Upload result for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-advisor-data-analysis-smoke
          path: outputs/smoke/
          if-no-files-found: warn
          retention-days: 3
